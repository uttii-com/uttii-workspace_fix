name: Package Nextcloud app

on:
  workflow_call:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'release' || 'release-validation' }}
    timeout-minutes: 45
    env:
      APP_ID: workspace_fix

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate app ID and version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from xml.etree import ElementTree as ET

          root = ET.parse("appinfo/info.xml").getroot()
          app_id = root.findtext("id")
          version = root.findtext("version")
          if app_id != os.environ["APP_ID"] or not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version or ""):
              raise SystemExit(f"Unexpected app id/version: {app_id!r}, {version!r}")
          if os.environ["GITHUB_EVENT_NAME"] == "release":
              tag = os.environ["GITHUB_REF_NAME"]
              if tag != f"v{version}":
                  raise SystemExit(f"Release tag {tag!r} must match info.xml v{version}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"APP_VERSION={version}\n")
          PY

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring,gd,curl,zip,xml,intl,pdo_sqlite
          coverage: none

      - name: Prepare application package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "build/staging/$APP_ID"
          # 配布に必要なファイルだけをステージングする。
          for path in appinfo css img js lib screenshots templates LICENSE README.md CHANGELOG.md; do
            if [[ -e "$path" ]]; then
              cp -a "$path" "build/staging/$APP_ID/"
            fi
          done
          test -s "build/staging/$APP_ID/appinfo/info.xml"
          rm -f "build/staging/$APP_ID/appinfo/signature.json"

      - name: Download verified Nextcloud server for signing
        shell: bash
        run: |
          set -euo pipefail
          url="https://download.nextcloud.com/server/releases/latest-35.zip"
          curl --fail --location --retry 3 --silent --show-error "$url" -o nextcloud.zip
          curl --fail --location --retry 3 --silent --show-error "$url.sha256" -o nextcloud.zip.sha256
          checksum="$(awk '$2 == "latest-35.zip" {print $1}' nextcloud.zip.sha256)"
          [[ "$checksum" =~ ^[0-9a-fA-F]{64}$ ]]
          printf '%s  %s\n' "$checksum" nextcloud.zip | sha256sum --check -
          unzip -q nextcloud.zip
          test -f nextcloud/occ

      - name: Sign application files and create archive
        shell: bash
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}
        run: |
          set -euo pipefail
          umask 077
          sign_dir="$(mktemp -d "$RUNNER_TEMP/nextcloud-sign.XXXXXX")"
          trap 'rm -f "$sign_dir/private.pem" "$sign_dir/certificate.pem"' EXIT
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            test -n "$APP_PRIVATE_KEY"
            test -n "$APP_PUBLIC_CRT"
            printf '%s\n' "$APP_PRIVATE_KEY" > "$sign_dir/private.pem"
            printf '%s\n' "$APP_PUBLIC_CRT" > "$sign_dir/certificate.pem"
          else
            openssl req -x509 -newkey rsa:2048 -noenc -days 1 -subj "/CN=$APP_ID" \
              -keyout "$sign_dir/private.pem" -out "$sign_dir/certificate.pem" 2>/dev/null
          fi
          unset APP_PRIVATE_KEY APP_PUBLIC_CRT
          umask 022

          openssl pkey -in "$sign_dir/private.pem" -pubout -outform DER > "$sign_dir/key.pub"
          openssl x509 -in "$sign_dir/certificate.pem" -pubkey -noout |
            openssl pkey -pubin -outform DER > "$sign_dir/cert.pub"
          cmp "$sign_dir/key.pub" "$sign_dir/cert.pub"

          php nextcloud/occ integrity:sign-app \
            --privateKey="$sign_dir/private.pem" \
            --certificate="$sign_dir/certificate.pem" \
            --path="$GITHUB_WORKSPACE/build/staging/$APP_ID"

          test -s "build/staging/$APP_ID/appinfo/signature.json"
          archive="build/$APP_ID-v$APP_VERSION.tar.gz"
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 \
            --numeric-owner -czf "$archive" -C build/staging "$APP_ID"
          tar -tzf "$archive" > build/archive-files.txt
          grep -Fx "$APP_ID/appinfo/info.xml" build/archive-files.txt
          grep -Fx "$APP_ID/appinfo/signature.json" build/archive-files.txt
          test "$(stat -c %s "$archive")" -le 20000000
          openssl dgst -sha512 -sign "$sign_dir/private.pem" -out build/archive.sig "$archive"
          openssl x509 -in "$sign_dir/certificate.pem" -pubkey -noout > "$sign_dir/cert.pem"
          openssl dgst -sha512 -verify "$sign_dir/cert.pem" -signature build/archive.sig "$archive"

      - name: Upload and verify GitHub Release asset
        if: ${{ github.event_name == 'release' }}
        id: attach
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          asset="$APP_ID-v$APP_VERSION.tar.gz"
          assets_api="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets"
          asset_url() {
            gh api --paginate "$assets_api" \
              --jq ".[] | select(.name == \"$asset\" and .state == \"uploaded\") | .browser_download_url"
          }
          url="$(asset_url)"
          if [[ -z "$url" ]]; then
            gh release upload "$GITHUB_REF_NAME" "build/$asset" --repo "$GITHUB_REPOSITORY"
            url="$(asset_url)"
          fi
          [[ "$url" == "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$asset" ]]
          curl --fail --location --retry 3 --silent --show-error "$url" -o build/downloaded.tar.gz
          cmp "build/$asset" build/downloaded.tar.gz
          printf 'download_url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Publish to Nextcloud App Store
        if: ${{ github.event_name == 'release' }}
        shell: bash
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          DOWNLOAD_URL: ${{ steps.attach.outputs.download_url }}
        run: |
          test -n "$APPSTORE_TOKEN"
          signature="$(openssl base64 -A -in build/archive.sig)"
          payload="$(jq -cn --arg download "$DOWNLOAD_URL" --arg signature "$signature" \
            '{download: $download, signature: $signature, nightly: false}')"
          status="$(curl --silent --show-error --max-time 120 --output /dev/null \
            --write-out '%{http_code}' --json "$payload" \
            --header "Authorization: Token $APPSTORE_TOKEN" \
            https://apps.nextcloud.com/api/v1/apps/releases)"
          case "$status" in
            200|201) printf 'App Store API: HTTP %s\n' "$status" ;;
            *) printf 'App Store 公開失敗 (HTTP %s)\n' "$status" >&2; exit 1 ;;
          esac
